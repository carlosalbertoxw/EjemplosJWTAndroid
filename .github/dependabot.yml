# Propone actualizaciones semanales de dependencias Gradle y GitHub Actions.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      # AndroidX y el plugin de Android juntos: sus actualizaciones suelen
      # depender entre sí (p. ej. un Compose BOM nuevo que exige otro compileSdk).
      android:
        patterns: ["androidx.*", "com.android.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
